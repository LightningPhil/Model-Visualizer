name: Check Model Visualizer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:models
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
      - run: npm run test:e2e -- tests/e2e/routing.spec.ts tests/e2e/simulation.spec.ts tests/e2e/attention.spec.ts tests/e2e/numerical.spec.ts
        env:
          CI: true
          PLAYWRIGHT_PREVIEW: '1'
